<!doctype html>
<!-- BUILD-TIME ONLY. This page is never loaded by the app and three.js is never
     shipped — it exists so the owner's Mjolnir GLB can be rendered offline into a
     sprite sheet that index.html plays back as plain frames. See tools/bake_hammer.mjs.
     Served over the same python http.server as the app, so the importmap can point
     straight at tools/node_modules and the GLB at the project root. -->
<meta charset="utf-8">
<title>bake: mjolnir</title>
<style>html,body{margin:0;background:transparent;}canvas{display:block;}</style>
<script type="importmap">
{ "imports": {
    "three": "/tools/node_modules/three/build/three.module.js",
    "three/addons/": "/tools/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1200;             // 1.5x the sprite cell, downsampled on composite for AA

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* Metal is nothing but reflections — with only ambient light this model would
   render as a flat grey slab, which is exactly the failure we're replacing.
   RoomEnvironment gives it a room to reflect; the key light gives it a hard
   specular edge to catch as it turns. */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(2.5, 3.5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd8ff, 2.0);
rim.position.set(-3, 1.5, -2);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe6c0, 0.7);
fill.position.set(0, -2, 2);
scene.add(fill);

/* Wide FOV on purpose. The approach used to be a CSS scale() on a fixed-distance
   render, which is a flat zoom — no foreshortening, no parallax, so it read as a
   decal getting bigger. The dolly is now baked (see `z` in render()), and a long
   lens would waste it: perspective only looms at a wide angle. */
const camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 100);
camera.position.set(0, 0, 6);
camera.lookAt(0, 0, 0);

/* Two nested groups so the tumble is independent of whatever arbitrary
   orientation and scale the Sketchfab export happens to use: `fix` normalises
   the model, `spin` is the only thing the bake animates. */
const spin = new THREE.Group();
const fix = new THREE.Group();
spin.add(fix);
scene.add(spin);

let info = null;

new GLTFLoader().load('/mjolnir_thors_hammer.glb', gltf => {
  const model = gltf.scene;

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const longest = Math.max(size.x, size.y, size.z);

  model.position.sub(centre);            // pivot at the model's own centre
  fix.scale.setScalar(2.6 / longest);    // normalise so framing is size-independent
  fix.add(model);

  info = {
    size: [size.x, size.y, size.z].map(v => +v.toFixed(3)),
    centre: [centre.x, centre.y, centre.z].map(v => +v.toFixed(3)),
    longestAxis: ['x', 'y', 'z'][[size.x, size.y, size.z].indexOf(longest)],
    meshes: [],
  };
  model.traverse(o => { if (o.isMesh) info.meshes.push({ name: o.name, mat: o.material?.type }); });

  window.BAKE_READY = true;
});

/* --- the API tools/bake_hammer.mjs drives ------------------------------- */
window.BAKE = {
  info: () => info,

  /* Euler angles in degrees, plus `z` — the dolly. Camera sits at z=6, so higher
     z means closer to the lens and a bigger, more distorted hammer. This is the
     whole point: the growth has to come from the projection, not from scaling
     the output afterwards. */
  render(rx = 0, ry = 0, rz = 0, z = 0) {
    spin.position.z = z;
    spin.rotation.set(
      THREE.MathUtils.degToRad(rx),
      THREE.MathUtils.degToRad(ry),
      THREE.MathUtils.degToRad(rz),
    );
    renderer.render(scene, camera);
  },

  frame: () => renderer.domElement.toDataURL('image/png'),

  /* Composite every frame into one grid and hand back a single WebP with alpha.
     One sheet plays back with steps() + background-position; N separate images
     would cost far more bytes and N more requests.

     Each frame is RECENTRED on its own alpha bounding box first. A tumbling
     hammer swings a long way from the model's pivot, so without this the sprite
     wanders around the cell — and since playback scales the cell up ~2.4x, that
     wander is multiplied into the hammer visibly missing the impact point. */
  async sheet(frames, cols, cw, ch, quality) {
    const rows = Math.ceil(frames.length / cols);
    const c = document.createElement('canvas');
    c.width = cols * cw; c.height = rows * ch;
    const ctx = c.getContext('2d');

    const probe = document.createElement('canvas');
    const pctx = probe.getContext('2d', { willReadFrequently: true });

    for (const [i, src] of frames.entries()) {
      const img = new Image();
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = src; });

      probe.width = img.width; probe.height = img.height;
      pctx.clearRect(0, 0, img.width, img.height);
      pctx.drawImage(img, 0, 0);
      const { data } = pctx.getImageData(0, 0, img.width, img.height);
      let x0 = img.width, y0 = img.height, x1 = -1, y1 = -1;
      for (let y = 0; y < img.height; y++) {
        for (let x = 0; x < img.width; x++) {
          if (data[(y * img.width + x) * 4 + 3] > 8) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      const dx = x1 < 0 ? 0 : (img.width / 2 - (x0 + x1) / 2) * (cw / img.width);
      const dy = y1 < 0 ? 0 : (img.height / 2 - (y0 + y1) / 2) * (ch / img.height);
      ctx.drawImage(img, (i % cols) * cw + dx, Math.floor(i / cols) * ch + dy, cw, ch);
    }
    return c.toDataURL('image/webp', quality);
  },
};
</script>
